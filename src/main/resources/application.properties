# =====================================================================
#  CONFIGURACION DE LA APLICACION
#  Curso JPA / Hibernate — base de datos PostgreSQL
# =====================================================================

spring.application.name=tienda-jpa

# ---------------------------------------------------------------------
#  CONEXION A POSTGRESQL
# ---------------------------------------------------------------------
#  Cambia usuario y contrasena por los tuyos. El puerto 5432 es el que
#  usa PostgreSQL por defecto; si lo instalaste con otro, ajustalo.
spring.datasource.url=jdbc:postgresql://localhost:5432/tienda_jpa
spring.datasource.username=migueljorami
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
#  HIBERNATE / JPA
# ---------------------------------------------------------------------
#  ddl-auto: que hace Hibernate con el esquema al arrancar.
#     validate    comprueba que las entidades coincidan con las tablas
#                 y NO toca nada. Es lo que usamos en el curso y lo que
#                 se usa en produccion.
#     update      crea y modifica tablas para que encajen con las
#                 entidades. Comodo en desarrollo, peligroso despues:
#                 nunca borra ni renombra, asi que el esquema se va
#                 llenando de columnas muertas.
#     create      borra y recrea el esquema en cada arranque.
#     create-drop igual, y ademas lo borra al apagar la aplicacion.
#     none        no hace nada.
#
#  NUNCA uses create ni create-drop contra una base de datos con datos
#  que te importen. Han costado incidentes reales.
spring.jpa.hibernate.ddl-auto=validate

#  Muestra en la consola el SQL que Hibernate genera. Durante el curso
#  dejalo en true: ver el SQL real es la mitad del aprendizaje.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#  Dialecto: le dice a Hibernate que sabor de SQL debe generar.
#  Spring Boot suele detectarlo solo, pero explicito es mas claro.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  Estrategia de nombres FISICOS. Convierte camelCase a snake_case
#  cuando NO pones @Column(name = "..."):  diasEntrega -> dias_entrega.
#  Es el valor por defecto de Spring Boot; se deja explicito porque el
#  ejercicio 1.1 del Modulo 1 depende de entender esta conversion.
#  Cuando SI pones @Column(name = "..."), ese nombre manda.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

#  Evita la excepcion "No serializer found" y los errores de
#  LazyInitializationException al serializar entidades. En el curso
#  devolvemos DTO desde los controladores, que es la solucion correcta,
#  pero esta linea ayuda mientras experimentas.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
#  SERVIDOR
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
#  LOGS UTILES DURANTE EL CURSO
# ---------------------------------------------------------------------
#  Muestra los valores que Hibernate pone en los parametros (?) del SQL.
logging.level.org.hibernate.orm.jdbc.bind=TRACE
#  Descomenta para contar cuantas consultas lanza cada peticion:
#  es la forma de detectar el problema N+1 del Modulo 2.
#logging.level.org.hibernate.stat=DEBUG
#spring.jpa.properties.hibernate.generate_statistics=true
